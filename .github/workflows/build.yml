name: build

# Gera .apk (Android), .exe e .msi (Windows) a cada push na main,
# e publica tudo numa release rolante chamada "latest".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages: '' impede a action de instalar o pacote legado "tools", que o
      # Google removeu do repositorio do SDK — o sdkmanager falha com
      # "Failed to find package 'tools'" e o job inteiro morre antes do Gradle.
      # Os componentes reais vao no passo seguinte.
      - name: SDK do Android
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Componentes do SDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      # O repo nao traz gradle-wrapper.jar (binario), entao usamos o Gradle
      # da action direto, sem wrapper.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Montar APK de debug
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Sem acesso a API do Actions do outro lado, o log vai para uma branch do
      # proprio repo, que da para ler por git.
      - name: Publicar log do erro
        if: failure()
        shell: bash
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          work="$RUNNER_TEMP/logrepo"
          rm -rf "$work" && mkdir -p "$work"
          tail -c 120000 "$RUNNER_TEMP/build.log" > "$work/android.log" 2>/dev/null || \
            echo "sem log: a falha foi antes do gradle" > "$work/android.log"
          cd "$work"
          git init -q -b ci-log-android
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -qm "android run ${{ github.run_number }}"
          git push -f "https://x-access-token:${CI_TOKEN}@github.com/${{ github.repository }}.git" ci-log-android

      - name: Renomear
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/GhostDay-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GhostDay-apk
          path: out/*.apk
          if-no-files-found: error

  windows:
    name: EXE e MSI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dependencias
        run: npm install --no-audit --no-fund

      - name: Montar instaladores
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # sem assinatura de codigo
        run: |
          set -o pipefail
          npx electron-builder --win nsis msi --publish never 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Publicar log do erro
        if: failure()
        shell: bash
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          work="$RUNNER_TEMP/logrepo"
          rm -rf "$work" && mkdir -p "$work"
          tail -c 120000 "$RUNNER_TEMP/build.log" > "$work/windows.log" 2>/dev/null || \
            echo "sem log: a falha foi antes do electron-builder" > "$work/windows.log"
          cd "$work"
          git init -q -b ci-log-windows
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -qm "windows run ${{ github.run_number }}"
          git push -f "https://x-access-token:${CI_TOKEN}@github.com/${{ github.repository }}.git" ci-log-windows

      - uses: actions/upload-artifact@v4
        with:
          name: GhostDay-windows
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: error

  release:
    name: Publicar em "latest"
    needs: [android, windows]
    runs-on: ubuntu-latest
    # always(): publica o que deu certo mesmo se um dos builds falhar — um erro
    # no Windows nao pode deixar o APK preso dentro do run.
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts

      - name: Listar o que saiu
        run: find artifacts -type f | sort || echo 'nenhum artefato'

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GhostDay (build mais recente)
          body: |
            Build automatico do commit ${{ github.sha }}.

            - `GhostDay-debug.apk` — Android, assinado com a chave de debug.
              Permita "instalar de fontes desconhecidas" para instalar.
            - `GhostDay-0.1.0-x64.exe` — instalador NSIS do Windows.
            - `GhostDay-0.1.0-x64.msi` — instalador MSI do Windows.

            Nenhum dos instaladores e assinado: o Windows vai mostrar aviso do
            SmartScreen (Mais informacoes -> Executar assim mesmo) e o Android
            vai pedir confirmacao de origem desconhecida.
          prerelease: true
          fail_on_unmatched_files: false
          files: artifacts/**/*
